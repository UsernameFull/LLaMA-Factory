name: schedule-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print trigger information
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u
